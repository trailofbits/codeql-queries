name: CodeQL queries test

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: trailofbits/setup-codeql@b8013ac1f220d4c372aca61c2baa643e07497165 # main
        with:
          version: '2.27.4'
          platform: 'linux64'
          checksum: '393bf92b66596141ec93baf9b483f4a350f3749916c922fed0dd63c67706047d'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make format-check
      - run: make test
      - name: Verify doc/QUERIES.md is up to date
        run: |
          make generate-table
          git diff --exit-code doc/QUERIES.md
