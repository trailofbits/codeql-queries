      - ["net", "", false, "DialTimeout", "", "", "ReturnValue", "tob-resource-acq", "manual"]
      - ["net", "", false, "Listen", "", "", "ReturnValue", "tob-resource-acq", "manual"]
      - ["net", "", false, "ListenPacket", "", "", "ReturnValue", "tob-resource-acq", "manual"]
